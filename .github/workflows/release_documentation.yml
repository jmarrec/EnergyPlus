name: Release Documentation

on:
  push:
    tags:
      - '*'

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.12'

jobs:
  build_release_documentation:
    name: Build and Package Documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Checkout EnergyPlus
      uses: actions/checkout@v6

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install LaTeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive texlive-xetex texlive-science

    - name: Configure documentation build
      run: cmake -S doc -B build/doc-release -DTEX_INTERACTION:STRING=batchmode

    - name: Build documentation
      run: cmake --build build/doc-release --target docs -j 4

    - name: Package documentation
      env:
        ARTIFACT_ROOT: ${{ github.workspace }}/release-documentation-artifact
        PACKAGE_ROOT: EnergyPlus-Documentation-${{ github.ref_name }}
      run: |
        rm -rf "$ARTIFACT_ROOT"
        mkdir -p "$ARTIFACT_ROOT/$PACKAGE_ROOT"
        cp -r build/doc-release/pdf/. "$ARTIFACT_ROOT/$PACKAGE_ROOT/"
        test -f "$ARTIFACT_ROOT/$PACKAGE_ROOT/index.html"
        test -f "$ARTIFACT_ROOT/$PACKAGE_ROOT/EngineeringReference.pdf"
        (
          cd "$ARTIFACT_ROOT"
          zip -r "${PACKAGE_ROOT}-x86_64.zip" "$PACKAGE_ROOT"
        )

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      with:
        name: energyplus-documentation-${{ github.ref_name }}
        path: ${{ github.workspace }}/release-documentation-artifact/EnergyPlus-Documentation-${{ github.ref_name }}-x86_64.zip
        if-no-files-found: error
        retention-days: 7
