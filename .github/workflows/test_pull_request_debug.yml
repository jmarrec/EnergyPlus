name: RelWithDebInfo Build and Test

on:
  pull_request:
    branches: [ develop ]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FC: gfortran-13
  Python_REQUIRED_VERSION: 3.12.3  # 3.12.2 not available on Ubuntu 24 GHA
  python-arch: x64
  os: ubuntu-24.04
  ENABLE_PCH: OFF

jobs:
  build_and_test:
    name: Debug Testing
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:

    - uses: actions/checkout@v5

    - name: Setup System
      id: setup-runner
      uses: ./.github/actions/setup-runner
      with:
        python-version: ${{ env.Python_REQUIRED_VERSION }}
        python-arch: ${{ env.python-arch }}

    - name: Install coverage tools
      shell: bash
      run: |
        pip install git+https://github.com/jmarrec/gcovr.git@1142_coverage

    - name: Create Build Directory
      shell: bash
      run: cmake -E make_directory ./build/

    - name: Install problem matcher
      shell: bash
      run: echo "::add-matcher::./.github/workflows/cpp-problem-matcher.json"

    - name: Restore Cache CCACHE
      uses: actions/cache/restore@v4
      id: cacheccache-restore
      with:
        path: |
          ${{ steps.setup-runner.outputs.ccache-dir }}
        key: ccache-RelWithDebInfo-${{ matrix.os }}-${{ steps.setup-runner.outputs.compiler-id }}-${{ github.head_ref }}-pch=${{ env.ENABLE_PCH }}
        restore-keys: |
          ccache-RelWithDebInfo-${{ matrix.os }}-${{ steps.setup-runner.outputs.compiler-id }}-${{ github.head_ref }}
          ccache-RelWithDebInfo-${{ matrix.os }}-${{ steps.setup-runner.outputs.compiler-id }}-

    - name: Did restoring the CCache-cache work?
      shell: bash
      run: |
        begin_group() { echo -e "::group::\033[93m$1\033[0m"; }
        Color_Off='\033[0m'       # Text Reset

        # Regular Colors
        Red='\033[0;31m'
        Green='\033[0;32m'
        BrightYellow='\033[93m'

        if [ "${{ steps.cacheccache-restore.outputs.cache-hit }}" == "true" ]; then
          echo -e "✅ ${Green}CCache primary key was hit${Color_Off}"
        else
          FILES_IN_CACHE=$(ccache --print-stats | grep "^files_in_cache" | awk '{print $2}')
          if [ "$FILES_IN_CACHE" -gt 0 ]; then
            echo -e "⚠️  ${BrightYellow}Secondary cache hit${Color_Off}"
          else
            echo -e "❌ ${Red}No cache hit${Color_Off}"
          fi;
        fi;

        begin_group "Showing existing ccache stats"
        ccache --show-stats -vv || ccache --show-stats
        echo "::endgroup::"

        ccache --zero-stats
        begin_group "Showing CCache config"
        ccache -p
        echo "::endgroup::"

    - name: Configure and Build
      id: branch_build
      uses: ./.github/actions/configure-and-build
      with:
        enable-pch: ${{ env.ENABLE_PCH }}
        minimal-targets: false
        build-directory: ./build
        nproc: ${{ steps.setup-runner.outputs.nproc }}
        python-version: ${{ env.Python_REQUIRED_VERSION }}
        python-root-dir: ${{ steps.setup-runner.outputs.python-root-dir }}
        build-type: "RelWithDebInfo"
        enable-coverage: "ON"
        build-python-cli: "OFF"

    - name: Remove problem matcher
      shell: bash
      run: echo "::remove-matcher owner=gcc-problem-matcher::"


    - name: Save CCache cache
      if: always() && steps.cacheccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.setup-runner.outputs.ccache-dir }}
        key: ${{ steps.cacheccache-restore.outputs.cache-primary-key }}

    - name: Setup upterm session
      uses: owenthereal/action-upterm@v1

    - name: Run Tests
      working-directory: ./build
      shell: bash
      run: |
        begin_group() { echo -e "::group::\033[93m$1\033[0m"; }

        Color_Off='\033[0m'       # Text Reset

        # Regular Colors
        Red='\033[0;31m'
        Green='\033[0;32m'

        begin_group "Running CTests"
        if ctest -j ${{ env.NPROC }}; then
          echo "::endgroup::"
          echo -e "✅ ${Green}All tests passed${Color_Off}"
        else
          echo "::endgroup::"
          echo -e "❌ ${Red}Some Tests Failed${Color_Off}"
          begin_group "Re-running failed tests verbosely..."
          ctest --rerun-failed -VV
          echo "::endgroup::"
        fi;

    - name: Prepare Initial Coverage Results
      shell: bash
      working-directory: ./build
      run: |
        gcovr --config ../gcovr.cfg --gcov-object-directory=.  --json coverage.json

    - name: Prepare HTML report
      shell: bash
      working-directory: ./build
      run: |
        mkdir html
        gcovr \
          --config ../gcovr.cfg --gcov-object-directory=. \
          --add-tracefile coverage.json \
          --html html/index.html --html-details \
          --html-theme=green \
          --sort=uncovered-percent

    - name: Prepare Markdown report
      shell: bash
      working-directory: ./build
      run: |
        # Coverage thresholds. Default for all is medium: >= 75.0, high: >= 90.0
        # Lines (current: 74.9%)
        # medium-threshold-line = 74.8
        # high-threshold-line = 74.9

        # Functions (current: 89.2%)
        # medium-threshold = 89.0
        # high-threshold = 89.2

        # Branches (current: 64.7%)
        # medium-threshold-branch = 64.6
        # high-threshold-branch = 64.7
        gcovr \
          --config ../gcovr.cfg --gcov-object-directory=. \
          --add-tracefile coverage.json \
          --medium-threshold-line=74.8 --high-threshold-line=74.9 \
          --medium-threshold=89.0 --high-threshold=89.2 \
          --medium-threshold-branch=64.6 --high-threshold-branch=64.7 \
          --markdown-summary=summary.md \
          --markdown=markdown.md \
          --sort=uncovered-percent

          cat summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '<details><summary>Full Coverage Report</summary>' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat markdown.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

    - name: Upload folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-results
        path: ./build/html
